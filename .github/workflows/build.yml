name: Build HexaMesh

on:
    push:
        tags: ["v*"]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        name: Build Android APK
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout HexaMesh
              uses: actions/checkout@v7

            - name: Checkout llama.cpp
              uses: actions/checkout@v7
              with:
                  repository: ggml-org/llama.cpp
                  path: llama.cpp

            - name: Set up JDK 21
              uses: actions/setup-java@v6
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: "gradle"

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4

            - name: Set up Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android

            - name: Cache Cargo
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Install cargo-ndk
              run: cargo install cargo-ndk

            - name: Download llama.cpp UI assets
              run: |
                  mkdir -p llama.cpp/tools/ui/dist
                  curl -L \
                    https://huggingface.co/buckets/ggml-org/llama-ui/resolve/latest/dist.tar.gz \
                    -o /tmp/llama-ui-dist.tar.gz
                  tar -xzf /tmp/llama-ui-dist.tar.gz -C llama.cpp/tools/ui/dist

            - name: Enable the RPC backend
              run: python3 scripts/enable_rpc.py llama.cpp

            - name: Build llama.cpp for Snapdragon (Docker)
              run: |
                  cd llama.cpp
                  echo "llama.cpp $(git rev-parse --short HEAD) ($(git log -1 --format=%cs))"
                  ./scripts/snapdragon/build.py --target adb

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Build APK
              run: ./gradlew assembleDebug

            - name: Upload APK artifact
              uses: actions/upload-artifact@v7
              with:
                  name: hexamesh-apk
                  path: app/build/outputs/apk/debug/app-debug.apk
                  retention-days: 7

            - name: Upload llama.cpp binaries
              uses: actions/upload-artifact@v7
              with:
                  name: llama-cpp-snapdragon
                  path: llama.cpp/pkg-adb/
                  retention-days: 7
            - name: Create Release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      app/build/outputs/apk/debug/app-debug.apk
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
